<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM App Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="p-4 bg-light text-center">
    <div class="container">
      <h1 class="mb-4">LLM Deployment Template</h1>
      <p class="lead">
        This app reads a <code>?url=</code> query parameter and displays it.
      </p>
      <div class="card p-3 shadow-sm">
        <p><strong>Captcha / Resource URL:</strong></p>
        <p id="display-url" class="text-primary fw-bold"></p>
      </div>
      <div id="solver-output" class="mt-4 alert alert-secondary">
        Awaiting implementation...
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const url = params.get("url") || "No URL provided";
      document.getElementById("display-url").textContent = url;

      // Placeholder solver simulation (students or LLMs replace with logic)
      setTimeout(() => {
        document.getElementById("solver-output").textContent =
          "Simulated output: SAMPLE-CAPTCHA-TEXT";
      }, 2000);
    </script>
  </body>
</html>
